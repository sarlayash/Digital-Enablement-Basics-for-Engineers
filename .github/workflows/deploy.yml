name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              "${artifact_api}" \
              | jq --exit-status '.artifacts[]? | select(.name == "github-pages" and .expired == false)' >/dev/null; then
              echo "github-pages artifact is visible. Waiting for the Pages deployment service to index it."
              sleep 35
              exit 0
            fi
            echo "Waiting for github-pages artifact indexing (${attempt}/12)."
            sleep 5
          done
          echo "::error::The github-pages artifact was not visible through the GitHub Actions API after 60 seconds."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

